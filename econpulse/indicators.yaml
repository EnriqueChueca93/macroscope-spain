  # ---------------------------------------------------------------- Trade by product (Batch 26a)
  # Spain's goods exports and imports by product group, monthly, Eurostat Comext (sources/comext.py).
  - id: trade_exp_total
    label: "Goods exports (Comext)"
    label_es: "Exportaciones de bienes (Comext)"
    section: international
    source: comext
    key: TOTAL
    params: {flow: exports, partner: WORLD}
    freq: M
    unit: "€ mn"
    scale: 0.000001
    decimals: 0
    transforms: [sum_1y, yoy]
    max_age_days: 150
    notes: All goods, community concept, not seasonally adjusted.

  - id: trade_imp_total
    label: "Goods imports (Comext)"
    label_es: "Importaciones de bienes (Comext)"
    section: international
    source: comext
    key: TOTAL
    params: {flow: imports, partner: WORLD}
    freq: M
    unit: "€ mn"
    scale: 0.000001
    decimals: 0
    transforms: [sum_1y, yoy]
    max_age_days: 150
    notes: All goods, community concept, not seasonally adjusted.

  - id: trade_bal_total
    label: "Goods trade balance (Comext)"
    label_es: "Saldo comercial de bienes (Comext)"
    section: international
    source: derived
    key: subtract
    params: {a: trade_exp_total, b: trade_imp_total}
    freq: M
    unit: "€ mn"
    decimals: 0
    transforms: [sum_1y, level]

  - id: trade_exp_{slug}
    for_each: *trade_groups
    label: "Goods exports, {name}"
    label_es: "Exportaciones, {name_es} (Comext, capítulos {hs})"
    section: international
    source: comext
    key: "{hs}"
    params: {flow: exports, partner: WORLD}
    freq: M
    unit: "€ mn"
    scale: 0.000001
    decimals: 0
    transforms: [sum_1y, yoy]
    max_age_days: 150

  - id: trade_imp_{slug}
    for_each: *trade_groups
    label: "Goods imports, {name}"
    label_es: "Importaciones, {name_es} (Comext, capítulos {hs})"
    section: international
    source: comext
    key: "{hs}"
    params: {flow: imports, partner: WORLD}
    freq: M
    unit: "€ mn"
    scale: 0.000001
    decimals: 0
    transforms: [sum_1y, yoy]
    max_age_days: 150

  # ---------------------------------------------------------------- Trade partners, services and prices (Batch 26b)
  # Goods trade with the EU and main partners (Comext, all goods); services trade by type (balance of
  # payments, quarterly); export and import prices of industrial products; national-accounts deflators.
  - id: trade_exp_{slug}
    for_each: *trade_partners
    label: "Goods exports to {name}"
    label_es: "Exportaciones de bienes a {name_es} (Comext)"
    section: international
    source: comext
    key: TOTAL
    params: {flow: exports, partner: "{code}"}
    freq: M
    unit: "€ mn"
    scale: 0.000001
    decimals: 0
    transforms: [sum_1y, yoy]
    max_age_days: 150

  - id: trade_imp_{slug}
    for_each: *trade_partners
    label: "Goods imports from {name}"
    label_es: "Importaciones de bienes de {name_es} (Comext)"
    section: international
    source: comext
    key: TOTAL
    params: {flow: imports, partner: "{code}"}
    freq: M
    unit: "€ mn"
    scale: 0.000001
    decimals: 0
    transforms: [sum_1y, yoy]
    max_age_days: 150

  - id: svc_exp_{slug}
    for_each: *services_types
    label: "Services exports, {name}"
    label_es: "Exportaciones de servicios, {name_es}"
    section: international
    source: eurostat
    key: bop_c6_q
    params: {geo: ES, currency: MIO_EUR, partner: WRL_REST, sectpart: S1, sector10: S1, bop_item: "{item}", stk_flow: CRE}
    freq: Q
    unit: "€ mn"
    change_unit: "%"
    decimals: 0
    transforms: [sum_1y, yoy]

  - id: svc_imp_{slug}
    for_each: *services_types
    label: "Services imports, {name}"
    label_es: "Importaciones de servicios, {name_es}"
    section: international
    source: eurostat
    key: bop_c6_q
    params: {geo: ES, currency: MIO_EUR, partner: WRL_REST, sectpart: S1, sector10: S1, bop_item: "{item}", stk_flow: DEB}
    freq: Q
    unit: "€ mn"
    change_unit: "%"
    decimals: 0
    transforms: [sum_1y, yoy]

  - id: export_prices_{slug}
    for_each: *trade_prices
    label: "Export prices, {name}"
    label_es: "Precios de exportación, {name_es}"
    section: international
    source: eurostat
    key: sts_inppnd_m
    params: {geo: ES, indic_bt: PRC_PRR_NDOM, nace_r2: "{exp}", unit: I21, s_adj: NSA}
    freq: M
    unit: index
    transforms: [yoy, pop]
    notes: Prices Spanish industry charges for its products sold abroad, 2021 = 100.

  - id: import_prices_{slug}
    for_each: *trade_prices
    label: "Import prices, {name}"
    label_es: "Precios de importación, {name_es}"
    section: international
    source: eurostat
    key: sts_inpi_m
    params: {geo: ES, indic_bt: PRC_IMP, cpa2_1: "{imp}", unit: I21, s_adj: NSA}
    freq: M
    unit: index
    transforms: [yoy, pop]
    notes: Prices of industrial products bought from abroad, 2021 = 100.

  - id: terms_of_trade_industrial
    label: "Terms of trade, industrial goods"
    label_es: "Relación real de intercambio, productos industriales"
    section: international
    source: derived
    key: divide
    params: {a: export_prices_all, b: import_prices_all, scale: 100}
    freq: M
    unit: index
    decimals: 1
    transforms: [level, yoy]
    notes: Export prices divided by import prices of industrial goods, 2021 = 100.

  - id: deflator_exports
    label: "Export deflator, goods and services"
    label_es: "Deflactor de las exportaciones de bienes y servicios"
    section: international
    source: eurostat
    key: namq_10_gdp
    params: {geo: ES, unit: PD15_EUR, s_adj: SCA, na_item: P6}
    freq: Q
    unit: index
    transforms: [yoy, pop]

  - id: deflator_imports
    label: "Import deflator, goods and services"
    label_es: "Deflactor de las importaciones de bienes y servicios"
    section: international
    source: eurostat
    key: namq_10_gdp
    params: {geo: ES, unit: PD15_EUR, s_adj: SCA, na_item: P7}
    freq: Q
    unit: index
    transforms: [yoy, pop]

  - id: deflator_exports_goods
    label: "Export deflator, goods"
    label_es: "Deflactor de las exportaciones de bienes"
    section: international
    source: eurostat
    key: namq_10_gdp
    params: {geo: ES, unit: PD15_EUR, s_adj: SCA, na_item: P61}
    freq: Q
    unit: index
    transforms: [yoy, pop]

  - id: deflator_imports_goods
    label: "Import deflator, goods"
    label_es: "Deflactor de las importaciones de bienes"
    section: international
    source: eurostat
    key: namq_10_gdp
    params: {geo: ES, unit: PD15_EUR, s_adj: SCA, na_item: P71}
    freq: Q
    unit: index
    transforms: [yoy, pop]

  - id: terms_of_trade
    label: "Terms of trade, goods and services"
    label_es: "Relación real de intercambio, bienes y servicios"
    section: international
    source: derived
    key: divide
    params: {a: deflator_exports, b: deflator_imports, scale: 100}
    freq: Q
    unit: index
    decimals: 1
    transforms: [level, yoy]
    notes: The export deflator divided by the import deflator (national accounts), 2015 = 100.

  - id: terms_of_trade_goods
    label: "Terms of trade, goods"
    label_es: "Relación real de intercambio, bienes"
    section: international
    source: derived
    key: divide
    params: {a: deflator_exports_goods, b: deflator_imports_goods, scale: 100}
    freq: Q
    unit: index
    decimals: 1
    transforms: [level, yoy]
    notes: The export deflator of goods divided by the import deflator of goods (national accounts), 2015 = 100.

  # ---------------------------------------------------------------- Pensions (Batch 29a)
  # Contributory pensions of the Social Security system, from the Ministry of Labour's statistics bulletin
  # (tables PEN-1 to PEN-31, sources/bel.py). Monthly series start with the bulletin's last 18 months
  # (April 2025) and grow from there; annual averages go back to 2016, maximum and minimum amounts to 1990.
  - id: pensions_{cls}
    for_each: *pension_classes
    label: "Contributory pensions{name}"
    label_es: "Pensiones contributivas en vigor{name_es}"
    section: pensions
    source: bel
    key: pen1
    params: {col: "{n}"}
    freq: M
    unit: thousands
    decimals: 0
    transforms: [level, yoy]
    notes: Pensions in force on the first of the month, in thousands (Ministry of Labour, BEL table PEN-1, from Social Security records).

  - id: pension_avg_{cls}
    for_each: *pension_classes
    label: "Average pension{name}"
    label_es: "Pensión media{name_es}"
    section: pensions
    source: bel
    key: pen1
    params: {col: "{a}"}
    freq: M
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the pensions in force on the first of the month, in euros; paid 14 times a year, except work-accident pensions, paid 12 times with the extra payments spread over the year (BEL table PEN-1).

  - id: pensions_{cls}_annual
    for_each: *pension_classes
    label: "Contributory pensions{name}, annual average"
    label_es: "Pensiones contributivas en vigor{name_es}, media anual"
    section: pensions
    source: bel
    key: pen1
    params: {col: "{n}"}
    freq: A
    unit: thousands
    decimals: 0
    transforms: [level, yoy]
    notes: Average over the year of the pensions in force each month, in thousands (BEL table PEN-1).

  - id: pension_avg_{cls}_annual
    for_each: *pension_classes
    label: "Average pension{name}, annual average"
    label_es: "Pensión media{name_es}, media anual"
    section: pensions
    source: bel
    key: pen1
    params: {col: "{a}"}
    freq: A
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average over the year of the average monthly pension, in euros (BEL table PEN-1).

  - id: pensions_scheme_{scheme}
    for_each: *pension_schemes
    label: "Contributory pensions, {name}"
    label_es: "Pensiones contributivas en vigor, {name_es}"
    section: pensions
    source: bel
    key: pen2
    params: {sheet: "{sheet}", col: "{n}"}
    freq: M
    unit: thousands
    decimals: 1
    transforms: [level, yoy]
    notes: Pensions in force on the first of the month, in thousands (BEL table PEN-2). Farm workers and domestic employees joined the General scheme in 2012.

  - id: pension_avg_scheme_{scheme}
    for_each: *pension_schemes
    label: "Average pension, {name}"
    label_es: "Pensión media, {name_es}"
    section: pensions
    source: bel
    key: pen2
    params: {sheet: "{sheet}", col: "{a}"}
    freq: M
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the pensions in force on the first of the month, in euros (BEL table PEN-2).

  - id: new_pensions_{cls}
    for_each:
      - {cls: total, name: "", name_es: "", n: 1, a: 2}
      - {cls: retirement, name: ", retirement", name_es: ", jubilación", n: 5, a: 6}
    label: "New pensions{name}"
    label_es: "Altas de pensiones{name_es}"
    section: pensions
    source: bel
    key: pen10
    params: {col: "{n}"}
    freq: M
    unit: thousands
    decimals: 1
    transforms: [level, sum_1y, yoy]
    notes: Pensions granted in the month, in thousands (BEL table PEN-10).

  - id: new_pension_avg_{cls}
    for_each:
      - {cls: total, name: "", name_es: "", n: 1, a: 2}
      - {cls: retirement, name: ", retirement", name_es: ", jubilación", n: 5, a: 6}
    label: "Average new pension{name}"
    label_es: "Importe medio de las altas{name_es}"
    section: pensions
    source: bel
    key: pen10
    params: {col: "{a}"}
    freq: M
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the pensions granted in the month, in euros (BEL table PEN-10).

  - id: new_pensions_{cls}_annual
    for_each:
      - {cls: total, name: "", name_es: "", n: 1, a: 2}
      - {cls: retirement, name: ", retirement", name_es: ", jubilación", n: 5, a: 6}
    label: "New pensions{name}, a year"
    label_es: "Altas de pensiones{name_es}, total anual"
    section: pensions
    source: bel
    key: pen10
    params: {col: "{n}"}
    freq: A
    unit: thousands
    decimals: 0
    transforms: [level, yoy]
    notes: Pensions granted over the year, in thousands (BEL table PEN-10).

  - id: new_pension_avg_{cls}_annual
    for_each:
      - {cls: total, name: "", name_es: "", n: 1, a: 2}
      - {cls: retirement, name: ", retirement", name_es: ", jubilación", n: 5, a: 6}
    label: "Average new pension{name}, annual"
    label_es: "Importe medio de las altas{name_es}, anual"
    section: pensions
    source: bel
    key: pen10
    params: {col: "{a}"}
    freq: A
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the pensions granted over the year, in euros (BEL table PEN-10).

  - id: ended_pensions_total
    label: "Pensions ended"
    label_es: "Bajas de pensiones"
    section: pensions
    source: bel
    key: pen11
    params: {col: 1}
    freq: M
    unit: thousands
    decimals: 1
    transforms: [level, sum_1y, yoy]
    notes: Pensions that ended in the month, mostly on the pensioner's death, in thousands (BEL table PEN-11).

  - id: ended_pensions_total_annual
    label: "Pensions ended, a year"
    label_es: "Bajas de pensiones, total anual"
    section: pensions
    source: bel
    key: pen11
    params: {col: 1}
    freq: A
    unit: thousands
    decimals: 0
    transforms: [level, yoy]
    notes: Pensions that ended over the year, in thousands (BEL table PEN-11).

  - id: ended_pension_avg_retirement
    label: "Average ended retirement pension"
    label_es: "Importe medio de las bajas de jubilación"
    section: pensions
    source: bel
    key: pen11
    params: {col: 6}
    freq: M
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the retirement pensions that ended in the month, in euros (BEL table PEN-11).

  - id: ended_pension_avg_retirement_annual
    label: "Average ended retirement pension, annual"
    label_es: "Importe medio de las bajas de jubilación, anual"
    section: pensions
    source: bel
    key: pen11
    params: {col: 6}
    freq: A
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the retirement pensions that ended over the year, in euros (BEL table PEN-11).

  - id: pensions_reg_{slug}
    for_each: *pension_regions
    label: "Contributory pensions, {name}"
    label_es: "Pensiones contributivas en vigor, {name}"
    section: pensions
    source: bel
    key: pen19
    params: {sheet: "{sheet}", col: "{col}"}
    freq: M
    unit: thousands
    decimals: 1
    transforms: [level, yoy]
    notes: Pensions in force on the first of the month, in thousands (BEL table PEN-19).

  - id: pension_avg_reg_{slug}
    for_each: *pension_regions
    label: "Average pension, {name}"
    label_es: "Pensión media, {name}"
    section: pensions
    source: bel
    key: pen20
    params: {sheet: "{sheet}", col: "{col}"}
    freq: M
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the pensions in force on the first of the month, in euros (BEL table PEN-20).

  - id: retirement_avg_reg_{slug}
    for_each: *pension_regions
    label: "Average retirement pension, {name}"
    label_es: "Pensión media de jubilación, {name}"
    section: pensions
    source: bel
    key: pen24
    params: {sheet: "{sheet}", col: "{col}"}
    freq: M
    unit: "€"
    decimals: 0
    transforms: [level, yoy]
    notes: Average monthly amount of the retirement pensions in force on the first of the month, in euros (BEL table PEN-24).

  - id: pension_{kind}
    for_each:
      - {kind: max, block: 0, col: 1, name: "Maximum pension", name_es: "Pensión máxima"}
      - {kind: min_spouse, block: 1, col: 1, name: "Minimum retirement pension at 65, with a dependent spouse", name_es: "Pensión mínima de jubilación, titular con 65 años, con cónyuge a cargo"}
      - {kind: min_single, block: 1, col: 2, name: "Minimum retirement pension at 65, living alone", name_es: "Pensión mínima de jubilación, titular con 65 años, sin cónyuge"}
      - {kind: min_other, block: 1, col: 3, name: "Minimum retirement pension at 65, with a spouse not dependent", name_es: "Pensión mínima de jubilación, titular con 65 años, con cónyuge no a cargo"}
    label: "{name}"
    label_es: "{name_es}"
    section: pensions
    source: bel
    key: pen31
    params: {block: "{block}", col: "{col}"}
    freq: A
    unit: "€"
    scale: 0.07142857142857142   # published a year; a month of the 14 payments
    decimals: 0
    transforms: [level, yoy]
    notes: The year's amount set in the budget, published in euros a year (BEL table PEN-31) and shown a month, over the 14 payments.

  # ---------------------------------------------------------------- Pensions: sustainability and comparisons (Batch 29b)
  - id: pension_spending_{slug}
    for_each: *pension_eu_areas
    label: "Pension spending, {name}"
    label_es: "Gasto en pensiones, {name_es} (% del PIB)"
    section: pensions
    source: eurostat
    key: spr_exp_pens
    params: {geo: "{geo}", spdepb: TOTAL, spdepm: TOTAL, unit: PC_GDP}
    freq: A
    unit: "% of GDP"
    change_unit: pp
    max_age_days: 1100           # published about 18 months after the year ends
    notes: All pensions, public and private, as % of GDP (Eurostat, social protection statistics, ESSPROS); old-age, early-retirement, disability and survivors' pensions.

  - id: old_age_dep_{slug}
    for_each: *pension_eu_areas
    label: "Old-age dependency ratio, {name}"
    label_es: "Tasa de dependencia de mayores, {name_es}"
    section: pensions
    source: eurostat
    key: demo_pjanind
    params: {geo: "{geo}", indic_de: OLDDEP1}
    freq: A
    unit: "%"
    change_unit: pp
    notes: People aged 65 and over per 100 people aged 15 to 64, on 1 January (Eurostat).

  - id: old_age_dep_proj_{slug}
    for_each: *pension_eu_areas
    label: "Old-age dependency ratio, projected, {name}"
    label_es: "Tasa de dependencia de mayores, proyección, {name_es}"
    section: pensions
    source: eurostat
    key: proj_23ndbi
    params: {geo: "{geo}", indic_de: OLDDEP1, projection: BSL}
    freq: A
    unit: "%"
    change_unit: pp
    notes: People aged 65 and over per 100 people aged 15 to 64, Eurostat's EUROPOP2023 baseline projection to 2100.

  - id: ss_balance_{slug}
    for_each: *pension_eu_areas
    label: "Social security funds' balance, {name}"
    label_es: "Capacidad o necesidad de financiación de los fondos de la seguridad social, {name_es}"
    section: pensions
    source: eurostat
    key: gov_10a_main
    params: {geo: "{geo}", sector: S1314, na_item: B9, unit: PC_GDP}
    freq: A
    unit: "% of GDP"
    change_unit: pp
    notes: Net lending (+) or borrowing (-) of the social security funds (sector S1314), as % of GDP (Eurostat, government finance statistics). In Spain the sector includes the Social Security and the public employment service.

  - id: public_pensions_{slug}
    for_each: *comparators
    label: "Public spending on pensions, {name}"
    label_es: "Gasto público en pensiones de jubilación y supervivencia, {name_es} (% del PIB)"
    section: pensions
    source: oecd
    key: "OECD.ELS.SPD,DSD_SOCX_AGG@DF_PUB_OLD,/{oecd}.A.SOCX.PT_B1GQ.ES10.C.TP01._Z"
    params: {batch: *comparator_areas, start: 1990}
    freq: A
    unit: "% of GDP"
    change_unit: pp
    max_age_days: 2300           # the OECD's social expenditure figures come four or five years late (Spain's 2021 still the latest in Nov 2026)
    notes: Public cash spending on old-age and survivors' pensions, as % of GDP (OECD Social Expenditure Database, SOCX).

  - id: replacement_rate_{slug}
    for_each: *comparators
    label: "Net pension replacement rate, {name}"
    label_es: "Tasa de sustitución neta de las pensiones, {name_es}"
    section: pensions
    source: oecd
    key: "OECD.ELS.SPD,DSD_PAG@DF_PRR,/{oecd}.A.NPRR100.PT_EARN_N_PRE_RET_INC.M._Z.M"
    params: {batch: *comparator_areas}
    freq: A
    unit: "%"
    change_unit: pp
    max_age_days: 1500           # Pensions at a Glance comes out every two years
    notes: The pension a man on the average wage who starts work at 22 in the reference year would get from mandatory schemes, as % of his net pay before retirement (OECD, Pensions at a Glance).
