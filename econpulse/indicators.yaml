    freq: Q
    unit: index
    transforms: [level, diff_yoy]
    max_age_days: 450            # the OECD publishes some countries two or three quarters late
    notes: House prices over disposable income per head, against the country's long-run average = 100 (the OECD's standardised ratio); not published for Poland.

