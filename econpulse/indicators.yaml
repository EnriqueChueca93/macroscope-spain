    source: ageing
    key: employment_adjusted
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [avg_1y, level]
    max_age_days: 300
    notes: Each sex and age group's own employment rate, weighted by its 2008 share of the population.

  - id: lfs_share_65plus
    label: "People aged 65 and over, share of the population aged 15 and over"
    label_es: "Población de 65 años y más, % de la población de 15 años y más"
    section: labour
