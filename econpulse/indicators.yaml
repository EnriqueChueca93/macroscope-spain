# What the forecasters read automatically predict (see the Forecasts part at the end), with
# each source's code for it: the IMF's WEO indicator and the Banco de España's table row.
forecast_measures: &forecast_measures
  - {m: gdp, name: real GDP growth, name_es: crecimiento del PIB real, unit: "%", imf: NGDP_RPCH, bde: GDP}
  - {m: inflation, name: inflation, name_es: inflación, unit: "%", imf: PCPIPCH, bde: HICP}
  - {m: unemployment, name: unemployment rate, name_es: tasa de paro, unit: "%", imf: LUR, bde: Unemployment rate}
  - {m: balance, name: government budget balance, name_es: saldo de las AA. PP., unit: "% of GDP", imf: GGXCNL_NGDP,
     bde: General government net lending}
# The government publishes no inflation forecast.
government_measures: &government_measures
  - {m: gdp, name: real GDP growth, name_es: crecimiento del PIB real, unit: "%"}
  - {m: unemployment, name: unemployment rate, name_es: tasa de paro, unit: "%"}
  - {m: balance, name: government budget balance, name_es: saldo de las AA. PP., unit: "% of GDP"}

