  # ---------------------------------------------------------------- Labour market by group (Batch 25c)
  # Eurostat labour force survey (EPA), quarterly rates, not seasonally adjusted: by sex, age and
  # citizenship (lfsq_*rgan) and, for ages 25-64, by educational attainment (lfsq_*rgaed).
  - id: lfs_act_{slug}
    for_each: *lfs_groups
    label: "Participation rate, {name}"
    label_es: "Tasa de actividad, {name_es}"
    section: labour
    source: eurostat
    key: lfsq_argan
    params: {geo: ES, unit: PC, sex: "{sex}", age: "{age}", citizen: "{citizen}"}
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [level, diff_yoy]
    max_age_days: 300

  - id: lfs_emp_{slug}
    for_each: *lfs_groups
    label: "Employment rate, {name}"
    label_es: "Tasa de empleo, {name_es}"
    section: labour
    source: eurostat
    key: lfsq_ergan
    params: {geo: ES, unit: PC, sex: "{sex}", age: "{age}", citizen: "{citizen}"}
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [level, diff_yoy]
    max_age_days: 300

  - id: lfs_une_{slug}
    for_each: *lfs_groups
    label: "Unemployment rate, {name}"
    label_es: "Tasa de paro, {name_es}"
    section: labour
    source: eurostat
    key: lfsq_urgan
    params: {geo: ES, unit: PC, sex: "{sex}", age: "{age}", citizen: "{citizen}"}
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [level, diff_yoy]
    max_age_days: 300

  - id: lfs_act_{slug}
    for_each: *lfs_education
    label: "Participation rate, {name}"
    label_es: "Tasa de actividad, {name_es}"
    section: labour
    source: eurostat
    key: lfsq_argaed
    params: {geo: ES, unit: PC, sex: T, age: Y25-64, isced11: "{isced}"}
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [level, diff_yoy]
    max_age_days: 300

  - id: lfs_emp_{slug}
    for_each: *lfs_education
    label: "Employment rate, {name}"
    label_es: "Tasa de empleo, {name_es}"
    section: labour
    source: eurostat
    key: lfsq_ergaed
    params: {geo: ES, unit: PC, sex: T, age: Y25-64, isced11: "{isced}"}
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [level, diff_yoy]
    max_age_days: 300

  - id: lfs_une_{slug}
    for_each: *lfs_education
    label: "Unemployment rate, {name}"
    label_es: "Tasa de paro, {name_es}"
    section: labour
    source: eurostat
    key: lfsq_urgaed
    params: {geo: ES, unit: PC, sex: T, age: Y25-64, isced11: "{isced}"}
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [level, diff_yoy]
    max_age_days: 300

  - id: lfs_emp_prime_ea
    label: "Employment rate, ages 25-54, euro area"
    label_es: "Tasa de empleo, 25 a 54 años, zona euro"
    section: labour
    source: eurostat
    key: lfsq_ergan
    params: {geo: EA21, unit: PC, sex: T, age: Y25-54, citizen: TOTAL}
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [level, diff_yoy]
    max_age_days: 300
    notes: Euro area of 21 countries (Bulgaria joined in 2026).

  # Participation and employment of everyone aged 15 and over, actual and at the 2008 age mix:
  # Macroscope calculation from Eurostat's population counts by sex, age and labour status (sources/ageing.py).
  - id: lfs_participation
    label: "Participation rate, ages 15 and over"
    label_es: "Tasa de actividad, 15 años y más"
    section: labour
    source: ageing
    key: participation
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [avg_1y, level]
    max_age_days: 300
    notes: Recombined from the rates of men and women in 13 age groups; matches Eurostat's published rate within 0.1 points.

  - id: lfs_participation_aged
    label: "Participation rate at the 2008 age mix, ages 15 and over"
    label_es: "Tasa de actividad con la estructura por edades de 2008, 15 años y más"
    section: labour
    source: ageing
    key: participation_adjusted
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [avg_1y, level]
    max_age_days: 300
    notes: Each sex and age group's own rate, weighted by its 2008 share of the population; the gap to the actual rate is the effect of ageing.

  - id: lfs_epop
    label: "Employment rate, ages 15 and over"
    label_es: "Tasa de empleo, 15 años y más"
    section: labour
    source: ageing
    key: employment
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [avg_1y, level]
    max_age_days: 300
    notes: Employed people as a share of the population aged 15 and over, recombined from 26 sex and age groups.

  - id: lfs_epop_aged
    label: "Employment rate at the 2008 age mix, ages 15 and over"
    label_es: "Tasa de empleo con la estructura por edades de 2008, 15 años y más"
