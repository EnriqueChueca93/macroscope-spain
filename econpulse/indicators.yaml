oecd_yield_areas: &oecd_yield_areas "GBR+CAN+JPN+USA"
oecd_gdp_areas: &oecd_gdp_areas "GBR+USA+CAN+JPN"
weo_area_codes: &weo_area_codes "ESP+FRA+DEU+ITA+NLD+PRT+POL+GBR+USA+CAN+JPN+G163"
# Spain, its comparators and the euro area (G163) in the IMF's World Economic Outlook.
weo_areas: &weo_areas
  - {slug: es, imf: ESP, area_name: Spain, area_name_es: España}
  - {slug: ea, imf: G163, area_name: euro area, area_name_es: zona euro}
  - {slug: fr, imf: FRA, area_name: France, area_name_es: Francia}
  - {slug: de, imf: DEU, area_name: Germany, area_name_es: Alemania}
  - {slug: it, imf: ITA, area_name: Italy, area_name_es: Italia}
  - {slug: nl, imf: NLD, area_name: Netherlands, area_name_es: Países Bajos}
  - {slug: pt, imf: PRT, area_name: Portugal, area_name_es: Portugal}
  - {slug: pl, imf: POL, area_name: Poland, area_name_es: Polonia}
  - {slug: uk, imf: GBR, area_name: United Kingdom, area_name_es: Reino Unido}
  - {slug: us, imf: USA, area_name: United States, area_name_es: Estados Unidos}
  - {slug: ca, imf: CAN, area_name: Canada, area_name_es: Canadá}
  - {slug: jp, imf: JPN, area_name: Japan, area_name_es: Japón}
# The IMF's measures on the International page: id prefix, WEO code, names, unit.
weo_measures: &weo_measures
  - {m: growth, code: NGDP_RPCH, name: real GDP growth, name_es: crecimiento del PIB real, unit: "%"}
  - {m: inflation, code: PCPIPCH, name: inflation (average CPI), name_es: inflación (IPC medio), unit: "%"}
  - {m: unemp, code: LUR, name: unemployment rate, name_es: tasa de paro, unit: "%"}
  - {m: deficit, code: GGXCNL_NGDP, name: government net lending, name_es: capacidad de financiación de las AAPP, unit: "% of GDP"}
  - {m: debt, code: GGXWDG_NGDP, name: government gross debt, name_es: deuda bruta de las AAPP, unit: "% of GDP"}
  - {m: primary, code: GGXONLB_NGDP, name: government primary balance, name_es: saldo primario de las AAPP, unit: "% of GDP"}
  - {m: ca, code: BCA_NGDPD, name: current account balance, name_es: saldo por cuenta corriente, unit: "% of GDP"}

# The same countries in the European Commission's AMECO database (via DBnomics), which has the euro area as EA20.
# Canada is left out: its AMECO figures stop in 2024.
ameco_area_codes: &ameco_area_codes "ESP+EA20+FRA+DEU+ITA+NLD+PRT+POL+GBR+USA+JPN"
ameco_areas: &ameco_areas
  - {slug: es, code: ESP, area_name: Spain, area_name_es: España}
  - {slug: ea, code: EA20, area_name: euro area, area_name_es: zona euro}
  - {slug: fr, code: FRA, area_name: France, area_name_es: Francia}
  - {slug: de, code: DEU, area_name: Germany, area_name_es: Alemania}
  - {slug: it, code: ITA, area_name: Italy, area_name_es: Italia}
  - {slug: nl, code: NLD, area_name: Netherlands, area_name_es: Países Bajos}
  - {slug: pt, code: PRT, area_name: Portugal, area_name_es: Portugal}
  - {slug: pl, code: POL, area_name: Poland, area_name_es: Polonia}
  - {slug: uk, code: GBR, area_name: United Kingdom, area_name_es: Reino Unido}
  - {slug: us, code: USA, area_name: United States, area_name_es: Estados Unidos}
  - {slug: jp, code: JPN, area_name: Japan, area_name_es: Japón}

# The OECD's standardised house price ratios (against each country's long-run average): none for Poland,
# and the United States' price-to-rent ratio stops in 2024.
house_income_areas: &house_income_areas "ESP+FRA+DEU+ITA+NLD+PRT+GBR+USA+CAN+JPN"
house_rent_areas: &house_rent_areas "ESP+FRA+DEU+ITA+NLD+PRT+GBR+CAN+JPN"

# Contributory pensions by class: the column of each class's number in the BEL tables PEN-1, PEN-10 and
# PEN-11 (its average amount is the next column).
pension_classes: &pension_classes
  - {cls: total, name: "", name_es: "", n: 1, a: 2}
  - {cls: retirement, name: ", retirement", name_es: ", jubilación", n: 5, a: 6}
  - {cls: widowhood, name: ", widowhood", name_es: ", viudedad", n: 7, a: 8}
  - {cls: disability, name: ", permanent disability", name_es: ", incapacidad permanente", n: 3, a: 4}
  - {cls: orphans, name: ", orphans", name_es: ", orfandad", n: 9, a: 10}
# Schemes (regímenes) in PEN-2: sheet, and the column of the number (the average is the next column).
pension_schemes: &pension_schemes
  - {scheme: general, name: "General scheme", name_es: "Régimen General", sheet: 0, n: 3, a: 4}
  - {scheme: self_employed, name: "Self-employed", name_es: "Trabajadores autónomos", sheet: 0, n: 7, a: 8}
  - {scheme: sea, name: "Sea workers", name_es: "Trabajadores del mar", sheet: 1, n: 1, a: 2}
  - {scheme: coal, name: "Coal mining", name_es: "Minería del carbón", sheet: 0, n: 5, a: 6}
  - {scheme: accidents, name: "Work accidents", name_es: "Accidentes de trabajo", sheet: 1, n: 5, a: 6}
  - {scheme: diseases, name: "Occupational diseases", name_es: "Enfermedades profesionales", sheet: 1, n: 7, a: 8}
  - {scheme: sovi, name: "SOVI (pre-1967 old-age insurance)", name_es: "SOVI", sheet: 1, n: 9, a: 10}
# Regions in PEN-19, PEN-20 and PEN-24: sheet and column (Ceuta and Melilla are published together).
pension_regions: &pension_regions
  - {slug: andalucia, name: Andalucía, sheet: 0, col: 1}
  - {slug: aragon, name: Aragón, sheet: 0, col: 2}
  - {slug: asturias, name: Asturias, sheet: 0, col: 3}
  - {slug: baleares, name: Illes Balears, sheet: 0, col: 4}
  - {slug: canarias, name: Canarias, sheet: 0, col: 5}
  - {slug: cantabria, name: Cantabria, sheet: 0, col: 6}
  - {slug: castilla_mancha, name: Castilla-La Mancha, sheet: 0, col: 7}
  - {slug: castilla_leon, name: Castilla y León, sheet: 0, col: 8}
  - {slug: cataluna, name: Cataluña, sheet: 0, col: 9}
  - {slug: valenciana, name: Comunitat Valenciana, sheet: 1, col: 1}
  - {slug: extremadura, name: Extremadura, sheet: 1, col: 2}
  - {slug: galicia, name: Galicia, sheet: 1, col: 3}
  - {slug: madrid, name: Madrid, sheet: 1, col: 4}
  - {slug: murcia, name: Murcia, sheet: 1, col: 5}
  - {slug: navarra, name: Navarra, sheet: 1, col: 6}
  - {slug: pais_vasco, name: País Vasco, sheet: 1, col: 7}
  - {slug: rioja, name: La Rioja, sheet: 1, col: 8}
  - {slug: ceuta_melilla, name: Ceuta y Melilla, sheet: 1, col: 9}

# Spain, its EU comparators and the EU in Eurostat's pension, population and government statistics.
pension_eu_areas: &pension_eu_areas
  - {slug: es, geo: ES, name: Spain, name_es: España}
  - {slug: fr, geo: FR, name: France, name_es: Francia}
  - {slug: de, geo: DE, name: Germany, name_es: Alemania}
  - {slug: it, geo: IT, name: Italy, name_es: Italia}
  - {slug: nl, geo: NL, name: Netherlands, name_es: Países Bajos}
  - {slug: pt, geo: PT, name: Portugal, name_es: Portugal}
  - {slug: pl, geo: PL, name: Poland, name_es: Polonia}
  - {slug: eu, geo: EU27_2020, name: EU, name_es: UE}

indicators:

  # ---------------------------------------------------------------- GDP (INE CNTR)
  # Chain-linked volume indices, seasonally and calendar adjusted.
  - id: gdp
    label: Real GDP
    label_es: Producto interior bruto (volumen)
    section: gdp
    source: ine
    key: CNTR6652
    freq: Q
    unit: index
    transforms: [pop, yoy]

    tile: 1
  - id: domestic_demand
    label: Domestic demand
    label_es: Demanda nacional
    section: gdp
    source: ine
    key: CNTR7146
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_households
    label: Household consumption
    label_es: Gasto en consumo final de los hogares
    section: gdp
    source: ine
    key: CNTR7161
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: consumption_government
    label: Government consumption
    label_es: Gasto en consumo final de las AAPP
    section: gdp
    source: ine
    key: CNTR7186
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment
    label: Fixed investment
    label_es: Formación bruta de capital fijo
    section: gdp
    source: ine
    key: CNTR7211
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports
    label: Exports
    label_es: Exportaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7265
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: imports
    label: Imports
    label_es: Importaciones de bienes y servicios
    section: gdp
    source: ine
    key: CNTR7285
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_construction
    label: Investment in construction
    label_es: FBCF en construcción
    section: gdp
    source: ine
    key: CNTR7221
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_housing
    label: Investment in housing
    label_es: FBCF en viviendas
    section: gdp
    source: ine
    key: CNTR7226
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: investment_equipment
    label: Investment in machinery and equipment
    label_es: FBCF en maquinaria, bienes de equipo y sistemas de armamento
    section: gdp
    source: ine
    key: CNTR7236
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports_goods
    label: Exports of goods
    label_es: Exportaciones de bienes
    section: gdp
    source: ine
    key: CNTR7270
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: exports_services
    label: Exports of services
    label_es: Exportaciones de servicios
    section: gdp
    source: ine
    key: CNTR7275
    freq: Q
    unit: index
    transforms: [pop, yoy]
    notes: Includes spending by foreign tourists in Spain.

  # Contributions to GDP growth, in percentage points, as published by INE.
  - id: contrib_domestic_qq
    label: Domestic demand, contribution to q/q growth
    label_es: Demanda nacional, aportación trimestral al PIB
    section: gdp
    source: ine
    key: CNTR7149
    freq: Q
    unit: pp

  - id: contrib_external_qq
    label: External demand, contribution to q/q growth
    label_es: Demanda externa, aportación trimestral al PIB
    section: gdp
    source: ine
    key: CNTR7263
    freq: Q
    unit: pp

  - id: contrib_domestic_yy
    label: Domestic demand, contribution to y/y growth
    label_es: Demanda nacional, aportación anual al PIB
    section: gdp
    source: ine
    key: CNTR7150
    freq: Q
    unit: pp

  - id: contrib_external_yy
    label: External demand, contribution to y/y growth
    label_es: Demanda externa, aportación anual al PIB
    section: gdp
    source: ine
    key: CNTR7264
    freq: Q
    unit: pp

  # Output by sector: gross value added, chain-linked volumes, adjusted.
  - id: gva_agriculture
    label: Gross value added, agriculture
    label_es: VAB agricultura, ganadería, silvicultura y pesca
    section: gdp
    source: ine
    key: CNTR6657
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_industry
    label: Gross value added, industry
    label_es: VAB industria
    section: gdp
    source: ine
    key: CNTR6662
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_construction
    label: Gross value added, construction
    label_es: VAB construcción
    section: gdp
    source: ine
    key: CNTR6672
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gva_services
    label: Gross value added, services
    label_es: VAB servicios
    section: gdp
    source: ine
    key: CNTR6677
    freq: Q
    unit: index
    transforms: [pop, yoy]

  - id: gdp_nominal
    label: Nominal GDP
    label_es: PIB a precios corrientes
    section: gdp
    source: ine
    key: CNTR6597
    freq: Q
    unit: "€ mn"
    decimals: 0
    transforms: [yoy, pop]
    notes: Current prices, seasonally and calendar adjusted, euros million per quarter.

  - id: gdp_deflator
    label: GDP deflator
    label_es: Deflactor implícito del PIB
    section: gdp
    source: derived
    key: divide
    params: {a: gdp_nominal, b: gdp}
    freq: Q
    unit: index
    transforms: [yoy, pop]
    notes: Nominal GDP divided by real GDP; the price of everything Spain produces.

  - id: jobs_fte
    label: Employment, full-time equivalent jobs
    label_es: Puestos de trabajo equivalentes a tiempo completo
    section: gdp
    source: ine
    key: CNTR7818
    freq: Q
    unit: thousands
    transforms: [yoy, pop]
    notes: National accounts measure, seasonally and calendar adjusted.

  # Already published as % changes on a year earlier.
  - id: productivity_fte
    label: Productivity per FTE job, y/y
    label_es: Productividad por puesto de trabajo equivalente a tiempo completo
    section: gdp
    source: ine
    key: CNTR8241
    freq: Q
    unit: "%"
    change_unit: pp

  - id: productivity_hour
    label: Productivity per hour worked, y/y
    label_es: Productividad por hora efectivamente trabajada
    section: gdp
    source: ine
    key: CNTR8242
    freq: Q
    unit: "%"
    change_unit: pp

  - id: unit_labour_cost
    label: Unit labour cost, y/y
    label_es: Coste laboral unitario
    section: gdp
    source: ine
    key: CNTR8244
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Compensation per employee relative to productivity.

  # ---------------------------------------------------------------- Labour
  - id: afiliados
    label: Social Security registrations
    label_es: Afiliados medios a la Seguridad Social
    section: labour
    source: segsocial
    key: TOTAL SISTEMA
    freq: M
    unit: thousands
    scale: 0.001
    transforms: [sa_diff, diff_yoy, yoy]
    tile: 2
    notes: Monthly average, total system. The monthly change is seasonally adjusted by Macroscope; the y/y change is as published.

  - id: unemployment_epa
    label: Unemployment rate (EPA)
    label_es: Tasa de paro (EPA)
    section: labour
    source: ine
    key: EPA423474
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    tile: 3
    notes: Labour force survey, not seasonally adjusted. The official measure.

  - id: employment_epa
    label: Employment (EPA)
    label_es: Ocupados (EPA)
    section: labour
    source: ine
    key: EPA387796
    freq: Q
    unit: thousands
    transforms: [yoy, diff_yoy, level]

  - id: unemployment_monthly
    label: Unemployment rate, monthly (SA)
    label_es: Tasa de paro mensual (desestacionalizada)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: TOTAL, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp
    notes: Eurostat's monthly estimate, benchmarked to the EPA.

  - id: youth_unemployment
    label: Youth unemployment rate (<25, SA)
    label_es: Tasa de paro juvenil (<25)
    section: labour
    source: eurostat
    key: une_rt_m
    params: {geo: ES, s_adj: SA, age: Y_LT25, sex: T, unit: PC_ACT}
    freq: M
    unit: "%"
    change_unit: pp

  - id: paro_registrado
    label: Registered unemployment
    label_es: Paro registrado
    section: labour
    source: bde
    key: D_1JA0D000
    freq: M
    unit: thousands
    scale: 0.001
    transforms: [diff_yoy, yoy]
    notes: Job seekers registered at public employment offices (SEPE), end of month, not seasonally adjusted.

  - id: activity_rate
    label: Activity rate (EPA)
    label_es: Tasa de actividad (EPA)
    section: labour
    source: ine
    key: EPA388038
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Share of people aged 16 and over who are working or looking for work.

  - id: employment_rate
    label: Employment rate (EPA)
    label_es: Tasa de empleo (EPA)
    section: labour
    source: ine
    key: EPA388039
    freq: Q
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Share of people aged 16 and over who are in work.

  - id: temporary_rate
    label: Temporary employment rate (EPA)
    label_es: Tasa de temporalidad (EPA)
    section: labour
    source: ine
    key: EPA416256
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Employees on temporary contracts, % of all employees. The 2022 labour reform cut it sharply.

  - id: long_term_unemployment
    label: Long-term unemployment rate
    label_es: Tasa de paro de larga duración
    section: labour
    source: eurostat
    key: une_ltu_q
    params: {geo: ES, indic_em: LTU, unit: PC_ACT, s_adj: NSA, age: Y15-74, sex: T}
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Unemployed for 12 months or more, % of the labour force aged 15-74 (Eurostat, from the EPA).

  - id: labour_slack
    label: Labour market slack
    label_es: Holgura del mercado laboral
    section: labour
    source: eurostat
    key: lfsi_sla_q
    params: {geo: ES, wstatus: SLACK, unit: PC_ELF, s_adj: SA, sex: T, age: Y15-74}
    freq: Q
    unit: "%"
    change_unit: pp
    notes: Unemployed people, part-timers who want more hours and people available but not looking, % of the extended labour force (Eurostat).

  - id: vacancies
    label: Job vacancies
    label_es: Puestos de trabajo vacantes (ETCL)
    section: labour
    source: ine
    key: ETCL2925
    freq: Q
    unit: thousands
    scale: 0.001
    transforms: [level, yoy]
    notes: Posts firms are trying to fill, from INE's labour cost survey; not seasonally adjusted.

  - id: vacancies_eurostat
    label: Job vacancies (Eurostat, from 2001)
    label_es: Puestos de trabajo vacantes (Eurostat, desde 2001)
    section: labour
    source: eurostat
    key: jvs_q_r21               # NACE Rev. 2.1; jvs_q_nace2 (NACE Rev. 2) stopped at 2025-Q4
    params: {geo: ES, indic_em: JOBVAC, s_adj: NSA, nace_r2_1: B-T, sizeclas: TOTAL}
    freq: Q
    unit: thousands
    scale: 0.001
    max_age_days: 300
    notes: INE's survey figures as Eurostat publishes them, back to 2001 (INE's own series here starts in 2013), now by the NACE Rev. 2.1 classification of activities; for the Michez rule's vacancy rate.

  # ---------------------------------------------------------------- Wages
  - id: wage_cost
    label: Wage cost per worker
    label_es: Coste salarial total por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL67
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Monthly average per worker in the quarter, not seasonally adjusted.

  - id: wage_cost_ordinary
    label: Ordinary wage cost per worker
    label_es: Coste salarial ordinario por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL66
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Regular pay, leaving out bonuses and back pay; a steadier read on wage growth.

  - id: wage_cost_hour
    label: Wage cost per hour
    label_es: Coste salarial total por hora efectiva (ETCL)
    section: wages
    source: ine
    key: ETCL4371
    freq: Q
    unit: "€"
    decimals: 2
    transforms: [yoy, level]

  - id: labour_cost
    label: Total labour cost per worker
    label_es: Coste laboral total por trabajador (ETCL)
    section: wages
    source: ine
    key: ETCL68
    freq: Q
    unit: "€"
    decimals: 0
    transforms: [yoy, level]
    notes: Wages plus employers' social contributions and other costs.

  - id: lci_wages
    label: Labour cost index, wages and salaries (SA)
    label_es: Índice de costes laborales, sueldos y salarios
    section: wages
    source: eurostat
    key: lc_lci_r2_q
    params: {geo: ES, unit: I20, s_adj: SCA, lcstruct: D11, nace_r2: B-S}
    freq: Q
    unit: index
    transforms: [yoy, pop]
    notes: Eurostat's harmonised measure, seasonally and calendar adjusted.

  - id: compensation_per_employee
    label: Compensation per employee, y/y
    label_es: Remuneración por puesto de trabajo equivalente asalariado
    section: wages
    source: ine
    key: CNTR8243
    freq: Q
    unit: "%"
    change_unit: pp
    notes: National accounts, per full-time equivalent employee.

  - id: wage_agreements
    label: Pay rise agreed in collective agreements
    label_es: Incremento salarial medio pactado en convenios
    section: wages
    source: bde
    key: DCC_M.VS.TOT.TOT._Z.TOT.25000.AC
    freq: M
    unit: "%"
    decimals: 2
    change_unit: pp
    notes: Average increase agreed for the current year in agreements registered so far (Ministerio de Trabajo); it restarts each January.

  # ---------------------------------------------------------------- Inflation
  - id: cpi
    label: CPI inflation
    label_es: IPC general, variación anual
    section: inflation
    source: ine
    key: IPC290750
    freq: M
    unit: "%"
    change_unit: pp

    tile: 5
  - id: core_cpi
    label: Core CPI inflation
    label_es: IPC subyacente, variación anual
    section: inflation
    source: ine
    key: IPC292510
    freq: M
    unit: "%"
    change_unit: pp
    tile: 6
    notes: Excludes unprocessed food and energy (INE definition).

  - id: cpi_index
    label: CPI index
    label_es: IPC general, índice
    section: inflation
    source: ine
    key: IPC290751
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  - id: core_cpi_index
    label: Core CPI index
    label_es: IPC subyacente, índice
    section: inflation
    source: ine
    key: IPC292511
    freq: M
    unit: index
    transforms: [pop, yoy]
    decimals: 2

  # CPI special groups (INE "grupos especiales"): core = processed food + goods + services.
  - id: cpi_services_index
    label: CPI services
    label_es: IPC servicios, índice
    section: inflation
    source: ine
    key: IPC292495
    freq: M
    unit: index
    transforms: [yoy, pop]

  - id: cpi_goods_index
    label: CPI non-energy industrial goods
