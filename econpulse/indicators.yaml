    key: share_65plus
    freq: Q
    unit: "%"
    change_unit: pp
    transforms: [avg_1y, level]
    max_age_days: 300
    notes: People in private households, from Eurostat's labour force survey; it leaves out care homes.

  # ---------------------------------------------------------------- Flows, hours and pay (Batch 25d)
