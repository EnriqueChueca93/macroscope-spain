# Macroscope Spain indicator registry.
#
# One entry per series. Fields:
#   id           unique name, also the CSV file name in data/series/
#   label        English name;  label_es: official Spanish name
#   section      gdp | labour | wages | inflation | financial | ecb | fiscal | activity | housing | international |
#                regions | analysis
#   source       ine | eurostat | ecb | bde | segsocial | ree | oecd | bis | bls | dbnomics | eia | worldbank |
#                bundesbank | imf | bdeproj (Banco de España projections) | funcas |
#                hicpdist (underlying inflation from Eurostat's detailed HICP items) |
#                ageing (participation adjusted for the population's ageing, from Eurostat's LFS) |
#                reg (Ministry of Labour: collective dismissals and temporary layoffs) |
#                comext (Eurostat Comext: goods trade by HS chapter) |
#                oilbulletin (European Commission's Weekly Oil Bulletin: petrol and diesel pump prices) |
#                fred | derived  (FRED does not answer GitHub's servers, so the online site avoids it)
#   key, params  what to ask the source for (see econpulse/sources/<source>.py)
#   freq         D | M | Q | A
#   unit         unit of the stored series: "%", "% of GDP", "bp", "pp", "thousands", "$/bbl", "€/MWh",
#                "€ mn", "€", "€/l" (a litre), or a plain number shown without suffix: "index", "balance", "rate"
#   scale        multiply fetched values (default 1), e.g. 0.001 for persons -> thousands
#   transforms   how to show it; the first one is the headline (level, pop, yoy, ann3m, saar, diff, diff_yoy;
#                sa_pop, sa_diff… first apply Macroscope seasonal adjustment)
#   decimals     decimals to display (default 1)
#   change_unit  pp | bp for rates; % for relative change (prices, indices, exchange rates)
#   tile         position in the home-page key-indicators strip (omit if not a tile)
#   max_age_days flag the series as "not updating" past this age (defaults by freq)
#   for_each     a list of items (countries, regions): the entry is repeated for each one,
#                with {placeholders} in its strings filled from the item's fields
#
# INE codes are series codes (not table ids): INE moves series to new tables when
# it rebases, so check `python -m econpulse status` if a series stops updating.
# What the section pages show (tables, charts) is defined in econpulse/pages.py.

# Lists used by for_each entries (YAML anchors: &name here, *name below).
countries: &countries
  - {slug: de, geo: DE, name: Germany, name_es: Alemania}
  - {slug: fr, geo: FR, name: France, name_es: Francia}
  - {slug: it, geo: IT, name: Italy, name_es: Italia}
  - {slug: pt, geo: PT, name: Portugal, name_es: Portugal}
  - {slug: nl, geo: NL, name: Netherlands, name_es: Países Bajos}
  - {slug: pl, geo: PL, name: Poland, name_es: Polonia}

# Other economies, from the OECD (CPI, unemployment, GDP, 10-year yields) and the BIS (policy rates).
# Japan's CPI comes from the BIS: the OECD's stops in 2021.
peers: &peers
  - {slug: uk, oecd: GBR, bis: GB, name: United Kingdom, name_es: Reino Unido,
     cpi_source: oecd, cpi_key: "OECD.SDD.TPS,DSD_PRICES@DF_PRICES_ALL,1.0/GBR.M.N.CPI.PA._T.N.GY"}
  - {slug: ca, oecd: CAN, bis: CA, name: Canada, name_es: Canadá,
     cpi_source: oecd, cpi_key: "OECD.SDD.TPS,DSD_PRICES@DF_PRICES_ALL,1.0/CAN.M.N.CPI.PA._T.N.GY"}
  - {slug: jp, oecd: JPN, bis: JP, name: Japan, name_es: Japón,
     cpi_source: bis, cpi_key: "WS_LONG_CPI/M.JP.771"}

# Spain and its comparators on the International page (Batch 27a), for the measures taken from one
# source for all of them: the OECD's labour statistics (youth unemployment, employment rate) and the
# IMF's World Economic Outlook (GDP per head at purchasing power). The euro area comes from Eurostat.
comparators: &comparators
  - {slug: es, oecd: ESP, name: Spain, name_es: España}
  - {slug: fr, oecd: FRA, name: France, name_es: Francia}
  - {slug: de, oecd: DEU, name: Germany, name_es: Alemania}
  - {slug: it, oecd: ITA, name: Italy, name_es: Italia}
  - {slug: nl, oecd: NLD, name: Netherlands, name_es: Países Bajos}
  - {slug: pt, oecd: PRT, name: Portugal, name_es: Portugal}
  - {slug: pl, oecd: POL, name: Poland, name_es: Polonia}
  - {slug: uk, oecd: GBR, name: United Kingdom, name_es: Reino Unido}
  - {slug: us, oecd: USA, name: United States, name_es: Estados Unidos}
  - {slug: ca, oecd: CAN, name: Canada, name_es: Canadá}
  - {slug: jp, oecd: JPN, name: Japan, name_es: Japón}

