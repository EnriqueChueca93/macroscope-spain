    freq: Q
    unit: index
    transforms: [yoy, level]
    max_age_days: 450            # the OECD publishes some countries two or three quarters late
    notes: Nominal house prices deflated by consumer prices (OECD analytical house prices).

  - id: price_income_{slug}
    for_each:
      - {slug: es, oecd: ESP, name: Spain, name_es: España}
      - {slug: fr, oecd: FRA, name: France, name_es: Francia}
      - {slug: de, oecd: DEU, name: Germany, name_es: Alemania}
      - {slug: it, oecd: ITA, name: Italy, name_es: Italia}
      - {slug: nl, oecd: NLD, name: Netherlands, name_es: Países Bajos}
      - {slug: pt, oecd: PRT, name: Portugal, name_es: Portugal}
      - {slug: uk, oecd: GBR, name: United Kingdom, name_es: Reino Unido}
      - {slug: us, oecd: USA, name: United States, name_es: Estados Unidos}
      - {slug: ca, oecd: CAN, name: Canada, name_es: Canadá}
      - {slug: jp, oecd: JPN, name: Japan, name_es: Japón}
    label: "House price to income ratio, {name}"
    label_es: "Ratio precio de la vivienda / renta, {name_es} (media de largo plazo = 100)"
    section: housing
    source: oecd
    key: "OECD.ECO.MPD,DSD_AN_HOUSE_PRICES@DF_HOUSE_PRICES,1.0/{oecd}.Q.HPI_YDH_AVG."
